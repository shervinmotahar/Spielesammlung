<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E0E0E">
<meta name="description" content="Black Jack gegen die Bank">
<title>Black Jack</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /* Design wie die Windows-Apps (Schach, Black Jack, DesktopSymbole): dunkel, nur Grautöne; farbig ist nur der Tisch */
  :root {
    --bg: #161616; --header: #0E0E0E; --card: #1F1F1F; --card-alt: #232323; --border: #333333; --line: #2A2A2A;
    --hover: #292929; --pressed: #333333; --sel: #2C2C2C;
    --text: #EDEDED; --muted: #9E9E9E; --faint: #6B6B6B;
    --primary: #3D3D3D; --primary-hover: #4B4B4B; --primary-pressed: #313131; --primary-disabled: #262626;
    --marker: #E6E6E6; --focus: #8A8A8A;
    --font: "Segoe UI", system-ui, -apple-system, Roboto, "Noto Sans", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; user-select: none; -webkit-user-select: none; }
  button { font: inherit; color: inherit; }

  /* Kopf */
  header { flex: none; display: flex; align-items: center; gap: 14px; background: var(--header); border-bottom: 1px solid var(--line);
           padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top)); }
  header img { width: 36px; height: 36px; }
  header h1 { margin: 0; font-weight: 300; font-size: 24px; line-height: 1.1; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }

  /* Spielbereich: Handy hochkant untereinander */
  main { flex: 1; min-height: 0; display: grid; gap: 8px; padding: 10px 10px 8px;
         grid-template-columns: minmax(0, 1fr);
         grid-template-rows: auto minmax(0, 1fr) auto auto auto auto;
         grid-template-areas: "top" "table" "bottom" "rounds" "actions" "buttons"; }
  #pBank { grid-area: top; } #pYou { grid-area: bottom; }
  #tableWrap { grid-area: table; min-height: 0; position: relative; }
  #table { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #roundsCard { grid-area: rounds; } #actions { grid-area: actions; } #buttons { grid-area: buttons; }

  /* Infokarte (Bank / Du) wie die Spielerkarten im Schach */
  .player { display: flex; align-items: center; gap: 12px; min-height: 50px; padding: 5px 12px 5px 14px; background: var(--card);
            border: 1px solid var(--border); position: relative; }
  .player.active { background: var(--sel); border-color: var(--focus); }
  .player.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--marker); }
  .player canvas { flex: none; width: 26px; height: 26px; }
  .player .names { flex: 1; min-width: 0; }
  .player .title { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player .sub { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .player.active .sub { color: var(--text); }
  .player .val { flex: none; text-align: right; }
  .player .val b { display: block; font-weight: 600; font-size: 16px; }
  .player .val span { font-size: 11.5px; color: var(--muted); }

  /* Rundenliste: Handy = waagrechter Streifen */
  .card { background: var(--card); border: 1px solid var(--border); }
  #roundsCard { display: flex; align-items: center; min-height: 36px; }
  #roundsCard .head { display: none; }
  #roundList { flex: 1; display: flex; overflow-x: auto; overflow-y: hidden; scrollbar-width: none; padding: 0 6px; }
  #roundList::-webkit-scrollbar { display: none; }
  .rrow { display: flex; align-items: center; flex: none; gap: 6px; padding: 4px 8px; font-size: 13.5px; white-space: nowrap; }
  .rrow .no { color: var(--faint); font-size: 12.5px; }
  .rrow .oc { display: none; color: var(--muted); font-size: 12.5px; }
  .rrow .net { font-weight: 600; } .rrow .net.minus { color: var(--muted); font-weight: 400; } .rrow .net.zero { color: var(--faint); font-weight: 400; }
  .empty { color: var(--faint); font-size: 13px; padding: 0 12px; }

  /* Knöpfe */
  #actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #buttons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 46px; padding: 4px;
         background: var(--card); border: 1px solid var(--border); cursor: pointer; font-size: 14px; color: var(--text); position: relative; }
  #buttons .btn { font-size: 12px; min-height: 52px; }
  .btn svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn:hover { background: var(--hover); } .btn:active { background: var(--pressed); }
  .btn.primary { background: var(--primary); border-color: var(--primary); font-weight: 600; }
  .btn.primary:hover { background: var(--primary-hover); } .btn.primary:active { background: var(--primary-pressed); }
  .btn:disabled { color: var(--faint); border-color: var(--line); background: var(--card); cursor: default; }
  .btn.primary:disabled { background: var(--primary-disabled); border-color: var(--primary-disabled); }
  .btn.marked:not(:disabled) { box-shadow: inset 0 0 0 2px var(--marker); }

  footer { flex: none; display: flex; align-items: center; gap: 12px; min-height: 36px; padding: 6px 16px;
           padding-bottom: calc(6px + env(safe-area-inset-bottom)); background: var(--header); border-top: 1px solid var(--line); font-size: 13px; }
  #status { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #info { color: var(--faint); white-space: nowrap; display: none; }

  /* Großer Bildschirm (Tablet quer, PC): Tisch links, Spalte rechts – wie die Windows-App */
  @media (min-width: 860px) and (min-aspect-ratio: 1/1) {
    header { padding: 14px 24px; } header img { width: 44px; height: 44px; } header h1 { font-size: 28px; }
    main { padding: 24px; gap: 10px 24px; grid-template-columns: minmax(0, 1fr) 300px;
           grid-template-rows: auto minmax(0, 1fr) auto auto auto;
           grid-template-areas: "table top" "table rounds" "table bottom" "table actions" "table buttons"; }
    .player { min-height: 64px; }
    #roundsCard { flex-direction: column; align-items: stretch; min-height: 0; }
    #roundsCard .head { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .3px; padding: 12px 14px 8px; }
    #roundList { flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 0; scrollbar-width: thin; }
    .rrow { padding: 6px 14px; gap: 0; } .rrow:nth-child(even) { background: var(--card-alt); }
    .rrow .no { width: 36px; } .rrow .sc { width: 100px; } .rrow .oc { display: block; flex: 1; } .rrow .net { margin-left: auto; }
    .empty { padding: 30px 16px; text-align: center; line-height: 1.6; }
    #actions { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    #buttons { grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .btn, #buttons .btn { flex-direction: row; gap: 8px; min-height: 38px; font-size: 14px; }
    .btn svg { width: 18px; height: 18px; }
    footer { padding: 8px 24px; } #info { display: block; }
  }

  /* Dialoge */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .sheet { background: var(--card); border: 1px solid var(--border); width: min(560px, calc(100% - 24px)); max-height: calc(100dvh - 24px);
           display: flex; flex-direction: column; }
  .sheet.wide { width: min(760px, calc(100% - 24px)); }
  .sheet .bar { display: flex; align-items: center; padding: 14px 10px 10px 22px; border-bottom: 1px solid var(--line); }
  .sheet .bar h2 { flex: 1; margin: 0; font-size: 17px; font-weight: 600; }
  .sheet .x { background: none; border: 0; color: var(--muted); font-size: 22px; width: 40px; height: 36px; cursor: pointer; }
  .sheet .body { overflow-y: auto; padding: 4px 22px 18px; }
  .sheet .foot { display: flex; gap: 10px; align-items: center; padding: 14px 22px; border-top: 1px solid var(--line);
                 padding-bottom: calc(14px + env(safe-area-inset-bottom)); }
  .sheet .foot .grow { flex: 1; }
  .msg { font-size: 15.5px; line-height: 1.45; padding: 16px 0 6px; }
  .note { font-size: 14px; line-height: 1.45; color: var(--muted); margin: 14px 0 0; }
  @media (max-width: 600px) {
    .overlay { align-items: flex-end; }
    .sheet, .sheet.wide { width: 100%; max-height: 92dvh; border-width: 1px 0 0; }
  }
  h3 { font-size: 11.5px; font-weight: 600; color: var(--muted); letter-spacing: .3px; margin: 20px 0 9px; text-transform: uppercase; }
  .fbtn { min-height: 40px; padding: 0 18px; background: var(--card); border: 1px solid var(--border); cursor: pointer; font-size: 14.5px; white-space: nowrap; }
  @media (max-width: 420px) { .fbtn { padding: 0 11px; } .sheet .foot { gap: 6px; padding-left: 14px; padding-right: 14px; } }
  .fbtn:hover { background: var(--hover); } .fbtn:active { background: var(--pressed); }
  .fbtn.primary { background: var(--primary); border-color: var(--primary); font-weight: 600; color: #fff; }
  .fbtn.primary:hover { background: var(--primary-hover); }
  .fbtn.link { background: none; border-color: transparent; color: var(--muted); padding: 0 6px; }
  .fbtn.link:hover { color: var(--text); text-decoration: underline; }
  .fbtn:disabled { color: var(--faint); border-color: var(--line); background: var(--card); cursor: default; }
  .choices { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 8px; }
  .choices .fbtn.on { background: var(--primary); border-color: var(--primary); font-weight: 600; color: #fff; }
  .tiles { display: flex; flex-wrap: wrap; gap: 10px; }
  .tile { width: 76px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); font-size: 12.5px; text-align: center; }
  .tile canvas { display: block; width: 72px; height: 60px; margin: 0 auto 5px; outline: 1px solid transparent; outline-offset: 2px; }
  .tile:hover canvas { outline-color: var(--focus); }
  .tile.on { color: var(--text); } .tile.on canvas { outline: 2px solid var(--marker); }
  @media (max-width: 420px) { .tiles { gap: 8px; } .tile { width: 58px; } .tile canvas { width: 54px; height: 48px; } }
  .toggle-row { display: flex; align-items: center; gap: 14px; padding: 6px 0; cursor: pointer; font-size: 14.5px; }
  .toggle { flex: none; width: 46px; height: 26px; border-radius: 13px; background: #3D3D3D; border: 0; position: relative; cursor: pointer; padding: 0; }
  .toggle::after { content: ""; position: absolute; left: 5px; top: 5px; width: 16px; height: 16px; border-radius: 50%; background: #8E8E8E; transition: left .12s; }
  .toggle.on { background: #E6E6E6; } .toggle.on::after { left: 25px; background: #161616; }
  .settings-grid { display: grid; grid-template-columns: 1fr; gap: 0 28px; }
  .settings-grid canvas.preview { width: 100%; max-width: 330px; aspect-ratio: 4 / 3; display: block; }
  @media (min-width: 720px) { .settings-grid { grid-template-columns: 1fr 300px; } }
  .rules p { font-size: 14.5px; line-height: 1.5; margin: 0; }
  /* Statistik */
  .stat-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
  .stat-tile { background: var(--bg); border: 1px solid var(--border); padding: 12px 14px; }
  .stat-tile b { display: block; font-weight: 300; font-size: 28px; line-height: 1.15; }
  .stat-tile span { color: var(--muted); font-size: 12.5px; }
  .legend { display: flex; gap: 16px; justify-content: flex-end; font-size: 12px; color: var(--muted); margin: -26px 0 10px; }
  .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; }
  @media (max-width: 600px) { .legend { margin: 0 0 8px; justify-content: flex-start; flex-wrap: wrap; } }
  .barrow { display: grid; grid-template-columns: 150px 1fr auto; gap: 12px; align-items: center; min-height: 32px; font-size: 14px; }
  @media (max-width: 600px) { .barrow { grid-template-columns: 1fr auto; gap: 2px 10px; padding: 4px 0; } .barrow .bar { grid-column: 1 / -1; grid-row: 2; } }
  .barrow.gap { margin-top: 10px; }
  .bar { height: 12px; background: var(--line); display: flex; }
  .bar i { display: block; height: 100%; }
  .barrow small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .line-text { font-size: 14.5px; margin: 12px 0 0; line-height: 1.5; }
  .games { border: 1px solid var(--border); max-height: 260px; overflow-y: auto; }
  .game { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 14px; align-items: center; }
  .game:nth-child(even) { background: var(--card-alt); }
  .game .who { font-weight: 600; font-size: 14px; }
  .game .meta { color: var(--muted); font-size: 12.5px; grid-column: 1; }
  .pill { grid-row: 1 / span 2; grid-column: 2; font-size: 11.5px; font-weight: 600; padding: 4px 10px; border-radius: 3px; white-space: nowrap; }
  .pill.win { background: var(--marker); color: var(--bg); } .pill.draw { background: var(--primary); }
  .pill.loss { background: #2C2C2C; color: var(--muted); }
  .games .empty { padding: 24px 16px; text-align: center; line-height: 1.6; }

  /* Menü oben rechts (Handy hochkant, seit 25.11.2026): Neues Spiel, Statistik, Regeln, Einstellungen, Aufgeben
     wandern dorthin, unten bleiben nur die Spielknöpfe. Breitbild (wie am PC): Knöpfe wie bisher, kein Menü. */
  header { position: relative; }
  header > div { min-width: 0; } header p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #menuBtn { margin-left: auto; flex: none; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center;
             background: none; border: 1px solid transparent; color: var(--text); cursor: pointer; }
  #menuBtn:hover, #menuBtn[aria-expanded="true"] { background: var(--hover); border-color: var(--border); }
  #menuBtn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  #menu { position: absolute; right: 10px; top: calc(100% - 4px); z-index: 9; min-width: 220px; background: var(--card);
          border: 1px solid var(--border); box-shadow: 0 10px 28px rgba(0,0,0,.55); padding: 4px 0; }
  #menu[hidden] { display: none; }
  #menu button { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 48px; padding: 0 18px; background: none; border: 0;
                 color: var(--text); font: inherit; font-size: 15px; text-align: left; cursor: pointer; }
  #menu button:hover, #menu button:focus-visible { background: var(--hover); outline: none; }
  #menu button:disabled { color: var(--faint); background: none; cursor: default; }
  #menu .sep { height: 1px; background: var(--line); margin: 4px 0; }
  #menu svg { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  @media not all and (min-width: 860px) and (min-aspect-ratio: 1/1) {
    #buttons { display: none !important; }
  }
  @media (min-width: 860px) and (min-aspect-ratio: 1/1) { #menuBtn, #menu { display: none !important; } }
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="">
  <div>
    <h1>Black Jack</h1>
    <p>Gegen die Bank</p>
  </div>
  <button id="menuBtn" type="button" title="Menü" aria-label="Menü" aria-haspopup="true" aria-expanded="false"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div id="menu" role="menu" hidden data-items="bNew,bStats,bRules,bSettings"></div>
</header>

<main>
  <div class="player" id="pBank"></div>
  <div id="tableWrap"><canvas id="table"></canvas></div>
  <div class="player" id="pYou"></div>
  <div class="card" id="roundsCard"><div class="head">RUNDEN</div><div id="roundList"></div></div>
  <div id="actions">
    <button class="btn" id="a0"></button><button class="btn" id="a1"></button><button class="btn" id="a2"></button>
    <button class="btn" id="a3"></button><button class="btn" id="a4"></button><button class="btn" id="a5"></button>
  </div>
  <div id="buttons">
    <button class="btn" id="bStats" title="Statistik"><svg viewBox="0 0 24 24"><path d="M4 20h16"/><path d="M7 16v-5M12 16V6M17 16v-8"/></svg>Statistik</button>
    <button class="btn" id="bRules" title="Regeln, Auszahlungen und Tasten"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5M9 8h6M9 12h6"/></svg>Regeln</button>
    <button class="btn" id="bNew" title="Neues Spiel (Strg+N)"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Neues Spiel</button>
    <button class="btn" id="bSettings" title="Einstellungen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Einstellungen</button>
  </div>
</main>

<footer><div id="status"></div><div id="info"></div></footer>

<script src="blackjack.js"></script>
<script src="app.js"></script>
</body>
</html>
